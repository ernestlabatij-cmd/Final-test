<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="src/styles/tokens.css">
    <link rel="stylesheet" href="src/components/card/card.css">
    <link rel="stylesheet" href="src/style.css">
    <link rel="stylesheet" href="src/styles/stryktyr.css">
</head>

<body>
<div class="wrapper">

    <header class="header">
        <div class="header-div">
            <div class="header-left">
                <div class="front-text">

                    <div class="holderChois" id="holderChois">
                        <div class="img-search2"></div>

                        <div class="search">
                            <img
                                    class="img-search"
                                    src="src/img/Vector(1).png"
                                    alt=""
                            >

                            <input
                                    type="text"
                                    id="cityChoise"
                                    placeholder="Select a city..."
                                    autocomplete="off"
                                    aria-label="Search city"
                            >
                        </div>

                        <div class="img-search2"></div>
                    </div>

                    <p class="city" id="Weather">Select a city</p>
                    <p class="temperatyr" id="temperatyr">--°C</p>
                    <p class="day-time" id="day-time">--</p>

                </div>
            </div>

            <div class="header-right">
                <img
                        class="img-tokken"
                        src="src/img/Group%20(1).png"
                        alt=""
                >
            </div>
        </div>
    </header>

    <main class="main">

        <div class="righ-div-main">

            <div class="header-right">

                <div class="first">

                    <!-- Indoor -->
                    <section class="header-first">
                        <img
                                class="heart"
                                src="src/img/Heart.png"
                                alt=""
                        >

                        <p class="Indoor">Indoor</p>

                        <img
                                class="img-termomether"
                                src="src/img/Group.png"
                                alt=""
                        >

                        <p class="temperatyr1" id="temperatyr1">--°C</p>

                        <img
                                class="img-kaplya"
                                src="src/img/Vector(2).png"
                                alt=""
                        >

                        <p class="Humid">Humid</p>
                        <p class="water" id="water">--</p>
                        <p class="water1">%</p>
                    </section>

                    <!-- Barometer -->
                    <section class="header-second">
                        <img
                                class="img-radar"
                                src="src/img/Group 2726.png"
                                alt=""
                        >

                        <div class="barometer-title">Barometer</div>

                        <img
                                class="img-kaplya1"
                                src="src/img/Group 2727.png"
                                alt=""
                        >

                        <div class="barometer-value">
                            <p class="p-barometer" id="barometer">--</p>
                            <p class="p-barometer1">inHg</p>
                        </div>

                        <div class="barometer-chart">
                            <canvas id="barometerChart"></canvas>
                        </div>
                    </section>

                    <!-- Moon phase -->
                    <section class="div-three">
                        <div class="p-holder">
                            <p class="thre-main-p">Moon Phase</p>
                        </div>

                        <div class="img-holder">
                            <img
                                    class="img-main"
                                    src="src/img/Frame.png"
                                    alt="Moon phases"
                            >
                        </div>
                    </section>

                </div>

                <div class="sekond"></div>
                <div class="three"></div>

            </div>

            <!-- 12-hour forecast -->
            <section class="fotore-div">
                <div class="main-fotore">
                    <p class="forecast-title">12-hour forecast</p>
                    <canvas id="forecastChart"></canvas>
                </div>
            </section>

        </div>

        <!-- Daily forecast panel -->
        <aside class="leaft-div-main">
            <div class="leaft-div">

                <div class="daily-header">
                    <p class="daily-city" id="dailyCity">Weather forecast</p>
                    <p class="daily-summary" id="dailySummary">
                        Select a city
                    </p>
                </div>

                <div class="daily-navigation">
                    <button
                            class="day-nav"
                            id="prevDay"
                            type="button"
                            aria-label="Previous day"
                            disabled
                    >‹</button>

                    <div
                            class="daily-days"
                            id="dailyDays"
                            aria-label="Daily forecast"
                    ></div>

                    <button
                            class="day-nav"
                            id="nextDay"
                            type="button"
                            aria-label="Next day"
                            disabled
                    >›</button>
                </div>

                <div class="daily-main">
                    <div class="daily-weather-icon" id="dailyWeatherIcon">
                        ⛅
                    </div>

                    <div class="daily-temperature">
                        <span id="dailyMax">--°</span>
                        <span class="daily-min" id="dailyMin">--°</span>
                    </div>
                </div>

                <div class="daily-details">

                    <div class="daily-detail">
                        <span>Real Feel</span>
                        <strong id="realFeel">--°C</strong>
                    </div>

                    <div class="daily-detail">
                        <span>Wind</span>
                        <strong id="wind">-- km/h</strong>
                    </div>

                    <div class="daily-detail">
                        <span>Chance of rain</span>
                        <strong id="chanceOfRain">--%</strong>
                    </div>

                    <div class="daily-detail">
                        <span>UV Index</span>
                        <strong id="uvindex">--</strong>
                    </div>

                </div>
            </div>
        </aside>

    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script type="module" src="src/components/search-input/search-input.js"></script>
</body>
</html>
