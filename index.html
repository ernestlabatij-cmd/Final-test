<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link rel="stylesheet" href="src/styles/tokens.css">
    <link rel="stylesheet" href="src/components/card/card.css">
    <link rel="stylesheet" href="src/style.css">
    <link rel="stylesheet" href="src/styles/stryktyr.css">
</head>
<body>

<div class="wrapper">
   <div class="header">
       <div class="header-div">
           <div class="header-left">
               <div class="front-text">
                  <div class="holderChois" id="holderChois">
                      <div class="img-search2"></div>
                    <div class="search">
                        <img   class="img-search"  src="src/img/Vector(1).png" alt=""> 
                        <input type="text"
                               id="cityChoise"
                               placeholder="Select a city..."
                               autocomplete="off"
                        >
                    </div>
                      <div class="img-search2"></div>
                  </div>
                   <p class="city" id="Weather">Cloudy</p>
                   <p class="temperatyr" id="temperatyr">26°C</p>
                   <p class="day-time"  id="day-time">Sunday | 12 Dec 2024</p>
               </div>
           </div>
           <div class="header-right">
               <img   class="img-tokken"   src="src/img/Group%20(1).png" alt="">
           </div>
       </div>

   </div>

    <div class="main">
         <div class="righ-div-main">
             <div class="header-right">
                 <div class="first">
                     <div class="header-first">
                         <img class="heart" src="src/img/Heart.png" alt="">
                         <p class="Indoor">Indoor</p>
                         <img class="img-termomether" src="src/img/Group.png" alt="">
                         <p class="temperatyr1" id="temperatyr1">22°C</p>
                         <img class="img-kaplya" src="src/img/Vector(2).png" alt="">
                         <p class="Humid">Humid</p>
                         <p class="water" id="water">20</p>
                         <p class="water1">%</p> 
                     </div>
                     <div class="header-second">
                        <img class="img-radar" src="src/img/Group 2726.png" alt="">
                         <div class="barometer-title">
                             Barometer
                         </div>
                         <img class="img-kaplya1" src="src/img/Group 2727.png" alt="">

                         <div class="barometer-value">
                              <p class="p-barometer" id="barometer">23.6</p>
                              <p class="p-barometer1">Hg</p>
                         </div>

                         <div class="barometer-chart">
                             <canvas id="barometerChart"></canvas>
                         </div>
                     </div>
                    <div class="div-three">
                       <div class="p-holder">
                           <p class="thre-main-p">Moon Phase</p>
                       </div>
                      <div class="img-holder">
                          <img  class="img-main"  src="src/img/Frame.png" alt="">
                      </div>
                    </div>
                 </div>
                 <div class="sekond"></div>
                 <div class="three"></div>
             </div>
             <br>
             <br>
             <br>
             <div class="fotore-div">
                 <div class="main-fotore">
                     <p class="forecast-title">12-hour forecast</p>

                     <canvas id="forecastChart"></canvas>
                 </div>
             </div>
         </div>
        <div class="leaft-div-main">
            <div class="leaft-div">
                <p class="realFeel" id="realFeel">g</p>
                <p class="wind" id="wind">g</p>
                <p class="chance of rain"  id="chance of rain">g</p>
                <p class="uvindex"  id="uvindex">g</p>
                <div class="img-back">
                    <img class="img-fotter-main" src="src/img/Vector%208.png" alt="">
                </div>
            </div>
        </div>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script type="module" src="src/components/search-input/search-input.js"></script>
<script type="module"  src="src/services/geocoding-api.js"></script>
</body>
</html>
